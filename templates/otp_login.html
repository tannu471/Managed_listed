<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Anime Character Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-brand">Name_list</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div class="login-form">
        <h2 class="section-title">Verify Email</h2>
        <form method="post" action="{{ url_for('send_otp') }}">
          <label>Email</label>
          <input class="input" type="email" name="email" required placeholder="you@example.com" />
          <button class="btn btn-green" type="submit">Send OTP</button>
        </form>
      </div>

      <div class="login-hint">We will send a one-time code to your email.</div>
    </div>
  </main>
</body>
</html>
