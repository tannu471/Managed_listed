<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verify OTP - Anime Character Manager</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="login-brand">Name_list</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <div class="login-form">
        <h2 class="section-title">Enter OTP</h2>
        <form method="post" action="{{ url_for('verify_otp') }}">
          <label>OTP</label>
          <input class="input" type="text" name="otp" required inputmode="numeric" placeholder="123456" />

          <input type="hidden" name="email" value="{{ email }}" />

          <button class="btn btn-green" type="submit">Verify</button>
        </form>

        <form method="get" action="{{ url_for('login') }}" style="margin-top:10px;">
          <button class="btn btn-secondary" type="submit">Change Email</button>
        </form>
      </div>

      <div class="login-hint">OTP expires in a few minutes.</div>
    </div>
  </main>
</body>
</html>
